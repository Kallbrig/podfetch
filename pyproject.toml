[project]
name = "podfetch"
version = "0.0.1"
description = "A CLI tool to download and archive podcast episodes from RSS feeds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.1",
]

[project.scripts]
podfetch = "archive:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "RUF",    # ruff-specific rules
]
ignore = [
    "T201",   # print() is the UI for a CLI tool
    "S314",   # xml.etree is safe in Python 3 (no XXE by default)
    "S603",   # subprocess — not used, but avoid false positives
    "RET504", # unnecessary assignment before return — readability choice
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.18",
]
